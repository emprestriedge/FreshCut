<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FreshCut Recall</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- home-screen app icon (added 2026-06-15) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
</head>
<body>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- TAB BAR NAVIGATION                              -->
  <!-- ═══════════════════════════════════════════════ -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="add" onclick="switchTab('add')">
      <i class="fas fa-user-plus"></i>
      <span>New</span>
    </button>
    <button class="tab-btn" data-tab="database" onclick="switchTab('database')">
      <i class="fas fa-address-book"></i>
      <span>Clients</span>
    </button>
  </nav>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- SCREEN 1: ADD NEW PERSON                        -->
  <!-- ═══════════════════════════════════════════════ -->
  <main class="screen active" id="screen-add">
    <header class="screen-header">
      <h1><i class="fas fa-scissors"></i> FreshCut Recall</h1>
      <p class="tagline">Quick — who'd you just meet?</p>
    </header>

    <form id="addForm" class="entry-form" onsubmit="handleSave(event)">
      <!-- Hidden field for editing existing entries -->
      <input type="hidden" id="editId" value="" />

      <div class="form-group">
        <label for="personName"><i class="fas fa-user"></i> Name</label>
        <input type="text" id="personName" placeholder="First name (last optional)" autocomplete="off" required />
      </div>

      <div class="form-group">
        <label for="phoneNumber"><i class="fas fa-phone"></i> Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="(555) 555-5555" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="location"><i class="fas fa-location-dot"></i> Location</label>
        <input type="text" id="location" placeholder="Town or neighborhood" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="clipperType"><i class="fas fa-ruler"></i> Hair Type / Clipper Guard</label>
        <input type="text" id="clipperType" placeholder="e.g. 2 guard, coarse & curly" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="talkAbout"><i class="fas fa-comments"></i> Conversation</label>
        <textarea id="talkAbout" rows="2" placeholder="Job, hobbies, sports team, whatever came up..."></textarea>
      </div>

      <!-- Pets section -->
      <div class="form-group toggle-group">
        <label><i class="fas fa-paw"></i> Any Pets?</label>
        <div class="toggle-row">
          <button type="button" class="toggle-btn" id="petsYes" onclick="togglePets(true)">Yes</button>
          <button type="button" class="toggle-btn" id="petsNo" onclick="togglePets(false)">No</button>
        </div>
      </div>
      <div class="form-group sub-field hidden" id="petDetails">
        <label for="petKind">What kind?</label>
        <input type="text" id="petKind" placeholder="Dog, cat, snake..." autocomplete="off" />
      </div>

      <!-- Kids section -->
      <div class="form-group toggle-group">
        <label><i class="fas fa-child"></i> Any Kids?</label>
        <div class="toggle-row">
          <button type="button" class="toggle-btn" id="kidsYes" onclick="toggleKids(true)">Yes</button>
          <button type="button" class="toggle-btn" id="kidsNo" onclick="toggleKids(false)">No</button>
        </div>
      </div>
      <div class="form-group sub-field hidden" id="kidDetails">
        <label for="kidInfo">How many?</label>
        <input type="text" id="kidInfo" placeholder="e.g. 3 teen daughters, 2 adult boys" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="notes"><i class="fas fa-note-sticky"></i> Notes</label>
        <textarea id="notes" rows="2" placeholder="Anything else worth remembering..."></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save" id="saveBtn">
          <i class="fas fa-check"></i> Save
        </button>
        <button type="button" class="btn-clear" onclick="clearForm()">
          <i class="fas fa-eraser"></i> Clear
        </button>
      </div>
    </form>
  </main>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- SCREEN 2: DATABASE / SEARCH                     -->
  <!-- ═══════════════════════════════════════════════ -->
  <main class="screen" id="screen-database">
    <header class="screen-header">
      <h1><i class="fas fa-address-book"></i> Your Clients</h1>
      <div class="search-wrap">
        <div class="search-bar">
          <i class="fas fa-search"></i>
          <input type="search" id="searchInput" placeholder="Name, phone or keyword" oninput="filterClients()" autocomplete="off" aria-label="Search clients" />
          <button type="button" class="cal-btn" id="calBtn" onclick="toggleCalendar()" aria-label="Pick a date" aria-expanded="false">
            <i class="fas fa-calendar-days"></i>
          </button>
        </div>
        <div class="cal hidden" id="calendar"></div>
      </div>
      <p class="client-count" id="clientCount">0 people saved</p>
    </header>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <i class="fas fa-user-plus"></i>
      <p>No one here yet — go meet someone!</p>
    </div>

    <!-- Client list -->
    <div class="client-list" id="clientList"></div>

    <!-- Export backup -->
    <div class="export-row" id="exportRow">
      <button class="btn-export" onclick="exportToCSV()">
        <i class="fas fa-download"></i> Backup to CSV
      </button>
    </div>
  </main>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- PROFILE MODAL (view / edit a single person)     -->
  <!-- ═══════════════════════════════════════════════ -->
  <div class="modal-overlay hidden" id="profileModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeProfile()"><i class="fas fa-times"></i></button>
      <div id="profileContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
